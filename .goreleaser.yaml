# Release build: run by .github/workflows/release.yml when a v* tag is pushed.
# Local dry run: goreleaser release --snapshot --clean
version: 2

project_name: whyd

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/whyd
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    # no version in the names, so releases/latest/download/<name> always works
    name_template: "{{ .ProjectName }}_linux_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

nfpms:
  - file_name_template: "{{ .ProjectName }}_linux_{{ .Arch }}"
    formats: [deb, rpm, archlinux]
    homepage: https://github.com/vmaltarello/whyd
    maintainer: Vladimir Alberto Maltarello <vmaltarello@gmail.com>
    description: Explains why the previous boot stopped, from the systemd journal.
    license: GPL-3.0-or-later
    section: utils
    bindir: /usr/bin
    dependencies: [systemd]
    archlinux:
      packager: Vladimir Alberto Maltarello <vmaltarello@gmail.com>
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/whyd/LICENSE
      - src: README.md
        dst: /usr/share/doc/whyd/README.md

changelog:
  use: github
  sort: asc

release:
  draft: false
