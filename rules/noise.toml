# Lines hidden by default and only counted.

[[rule]]
id       = "noise.firewall"
kind     = "noise"
title    = "firewall log lines"
source   = "kernel"
# a packet logged by netfilter, whatever the prefix: ufw, firewalld, nftables, iptables
message  = '\bIN=\S* OUT=\S* .*\bSRC='

[[rule.example]]
match = "[UFW BLOCK] IN=wlan0 OUT= MAC=02:1a:2b:3c:4d:5e SRC=192.168.50.254 DST=192.168.50.94 LEN=468"
[[rule.example]]
match = "filter_IN_public_REJECT: IN=wlp1s0 OUT= MAC=02:1a:2b:3c:4d:5e SRC=192.0.2.10 DST=192.0.2.20 LEN=60 PROTO=TCP"
[[rule.example]]
nomatch = "wlan0: Limiting TX power to 23 dBm"

[[rule]]
id       = "noise.rtw88-push"
kind     = "noise"
title    = "rtw88 push errors"
source   = "kernel"
message  = 'rtw88_\w+ \S+: failed to pusk skb'

[[rule.example]]
match = "rtw88_8822ce 0000:01:00.0: failed to pusk skb, ret -28"

[[rule]]
id       = "noise.wireless-ext"
kind     = "noise"
title    = "wireless extensions warnings"
source   = "kernel"
message  = 'uses wireless extensions which will stop working'

[[rule.example]]
match = "warning: `Socket Thread' uses wireless extensions which will stop working for Wi-Fi 7 hardware; use nl80211"

[[rule]]
id       = "noise.wpa-multicast"
kind     = "noise"
title    = "wpa_supplicant multicast notices"
source   = "wpa_supplicant"
message  = 'multicast RX registrations are not supported'

[[rule.example]]
match = "wlp1s0: nl80211: kernel reports: multicast RX registrations are not supported"
